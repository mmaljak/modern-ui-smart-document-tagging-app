[project]
name = "document-tagger"
version = "0.1.0"
description = "Smart Document Tagging API — classify PDF/DOCX/TXT into business categories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mario Maljak", email = "maljak.mario@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "transformers>=4.40",
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "slowapi>=0.1.9",
    "structlog>=24.0",
    "python-magic>=0.4.27",
    "openai>=1.0",
    "numpy>=1.26",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.urls]
Repository = "https://github.com/mmaljak/modern-ui-smart-document-tagging-app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    # Windows: bundles libmagic DLL so python-magic imports without WSL
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_tagger"]
