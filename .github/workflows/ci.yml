name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies (CPU torch, dev extras)
        run: |
          uv pip install --system \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            ".[dev]" \
            "python-magic-bin; sys_platform == 'win32'"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests (model is mocked — no HF download)
        run: pytest tests/ --cov=document_tagger --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build -t document-tagger-api:ci .

      - name: Build frontend (UI) image
        run: docker build -t document-tagger-ui:ci ./frontend
